[workspace]
name = "data-glove-wuji-teleop"
version = "0.1.0"
description = "Wuji v1/v2 dataglove calibration, teleoperation, simulation and replay."
channels = ["conda-forge"]
platforms = [{ platform = "linux-64", glibc = "2.34" }]

[activation.env]
PYTHONPATH = "$PIXI_PROJECT_ROOT/..:$PIXI_PROJECT_ROOT/vendor/wuji-retargeting"

# Keep native numerical libraries in conda-forge; do not pip-install upstream pin.
[dependencies]
python = ">=3.12,<3.13"
mujoco = ">=3.6,<4"
numpy = ">=1.26,<3"
scipy = ">=1.11,<2"
pyzmq = ">=25"
pyyaml = ">=6,<7"
h5py = ">=3.11,<4"
opencv = ">=4.10,<5"
ffmpeg = ">=7,<9"
pinocchio = ">=3.8,<4"
nlopt = ">=2.7,<3"
setuptools = ">=75"

[pypi-dependencies]
data-glove-wuji-teleop = { path = ".", editable = true }
wuji-sdk = "==2026.7.21"

[tasks]
test = "python -m unittest discover -s tests -p 'test_*.py' -v"
validate = "python -m data_glove_wuji_teleop.project --generation all --hand both --load-mujoco --allow-missing-calibration"
check = { depends-on = ["test", "validate"] }
sdk-check = "python -c \"from importlib.metadata import version; import wuji_sdk; print('wuji-sdk', version('wuji-sdk'), '导入成功')\""
inspect = "python -m data_glove_wuji_teleop.cli inspect"
calibrate-left = "python -m data_glove_wuji_teleop.cli calibrate --hand left --output config/dataglove/calibration/left.json"
calibrate-right = "python -m data_glove_wuji_teleop.cli calibrate --hand right --output config/dataglove/calibration/right.json"
calibrate-dataglove-urdf-zero = "python -m data_glove_wuji_teleop.cli calibrate-urdf-zero"
register-glove = "python -m data_glove_wuji_teleop.cli register-glove"
list-gloves = "python -m data_glove_wuji_teleop.cli list-gloves"
show-glove = "python -m data_glove_wuji_teleop.cli show-glove"
bind-task = "python -m data_glove_wuji_teleop.cli bind-task"
list-tasks = "python -m data_glove_wuji_teleop.cli list-tasks"
show-task = "python -m data_glove_wuji_teleop.cli show-task"
stream-glove = "python -u -m data_glove_wuji_teleop.cli stream-glove"
prepare-glove-network = "python -m data_glove_wuji_teleop.cli prepare-glove-network"
reuse-faulty-left = "python -m data_glove_wuji_teleop.cli reuse-faulty-encoders --hand left --cal-file config/dataglove/calibration/left.json"
reuse-faulty-right = "python -m data_glove_wuji_teleop.cli reuse-faulty-encoders --hand right --cal-file config/dataglove/calibration/right.json"
dry-run-left = "python -m data_glove_wuji_teleop.cli run --hand left --cal-file config/dataglove/calibration/left.json --dry-run"
dry-run-right = "python -m data_glove_wuji_teleop.cli run --hand right --cal-file config/dataglove/calibration/right.json --dry-run"
dataglove-urdf-right = "python -m data_glove_wuji_teleop.adapters.simulation.mujoco_dataglove"
dataglove-urdf-both = "python -m data_glove_wuji_teleop.adapters.simulation.mujoco_dataglove_pair"
official-retarget-v2-right = "python -u -m data_glove_wuji_teleop.adapters.simulation.mujoco_wuji_official --hand right"
official-retarget-v2-left = "python -u -m data_glove_wuji_teleop.adapters.simulation.mujoco_wuji_official --hand left"
official-teleop-v2 = "python -u -m data_glove_wuji_teleop.official_teleop"
tianji-send = "python -u -m data_glove_wuji_teleop.application.tianji_stream"
official-real-v2-right = "bash scripts/launch_official_real_v2_right.sh"
replay-data = "python -u -m data_glove_wuji_teleop.replay"
replay-data-list = "python -m data_glove_wuji_teleop.replay --list"
simulator-v1-left = "python -m data_glove_wuji_teleop.adapters.simulation.mujoco_wuji_v1 --hand left"
simulator-v1-right = "python -m data_glove_wuji_teleop.adapters.simulation.mujoco_wuji_v1 --hand right"
simulator-v2-left = "python -m data_glove_wuji_teleop.adapters.simulation.mujoco_wuji_v2 --hand left"
simulator-v2-right = "python -m data_glove_wuji_teleop.adapters.simulation.mujoco_wuji_v2 --hand right"
mujoco-v1-left = "bash scripts/launch_mujoco.sh --generation v1 --hand left"
mujoco-v1-right = "bash scripts/launch_mujoco.sh --generation v1 --hand right"
mujoco-v1-both = "bash scripts/launch_mujoco.sh --generation v1 --hand both"
mujoco-v2-left = "bash scripts/launch_mujoco.sh --generation v2 --hand left"
mujoco-v2-right = "bash scripts/launch_mujoco.sh --generation v2 --hand right"
mujoco-v2-both = "bash scripts/launch_mujoco.sh --generation v2 --hand both"
real-v1-left = "python -m data_glove_wuji_teleop.hardware_cli --generation v1 --hand left"
real-v1-right = "python -m data_glove_wuji_teleop.hardware_cli --generation v1 --hand right"
real-v1-both = "python -m data_glove_wuji_teleop.hardware_cli --generation v1 --hand both"
real-v2-left = "python -m data_glove_wuji_teleop.hardware_cli --generation v2 --hand left"
real-v2-right = "python -m data_glove_wuji_teleop.hardware_cli --generation v2 --hand right"
real-v2-both = "python -m data_glove_wuji_teleop.hardware_cli --generation v2 --hand both"
real-v2-left-realtime = "python -m data_glove_wuji_teleop.hardware_cli --generation v2 --hand left --tracking-mode realtime --rate 50"
real-v2-right-realtime = "python -m data_glove_wuji_teleop.hardware_cli --generation v2 --hand right --tracking-mode realtime --rate 50"
real-v2-both-realtime = "python -m data_glove_wuji_teleop.hardware_cli --generation v2 --hand both --tracking-mode realtime --rate 50"
hand2-zero-recovery = "python -m data_glove_wuji_teleop.adapters.hardware.hand2_zero_recovery"
