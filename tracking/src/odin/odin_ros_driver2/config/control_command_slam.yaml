register_keys:

  # ============================================================================
  # SLAM / odometry-only profile (used by driver_slam.launch.py).
  # Cameras off to keep CPU minimal; point clouds + odom + imu kept.
  # The post-processing keys below are irrelevant here because
  # driver_slam.launch.py does not launch those nodes — kept for clarity.
  # ============================================================================

  # Raw point cloud stream
  enable_raw_point: 1

  # SLAM point cloud stream (map / relocalization)
  enable_slam_point: 1

  # Left camera (Image0) stream - off
  enable_image0: 0

  # Right camera (Image1) stream - off (this unit is single-camera anyway)
  enable_image1: 0

  # IMU data stream
  enable_imu: 1

  # Odometry data stream (includes the map->odom relocalization TF)
  enable_odom: 1

  # ---- post-processing (not launched in slam profile) ----
  post_process: 0
  send_image_raw: 0
  send_image2_raw: 0
  send_cloud_render: 0
  send_ess_output: 0
  send_depth_pointcloud: 0
  enable_reprojection: 0
  reprojection_mode: "raw"
