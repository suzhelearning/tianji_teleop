# rosbag2_qos.yaml
# QoS overrides for rosbag2 recording
# 用于 rosbag2 录制的 QoS 配置
# 
# Usage / 使用方法:
#   ros2 bag record -a --qos-profile-overrides-path rosbag2_qos.yaml

# High frequency data (IMU 400Hz, Odom 100Hz)
# 高频数据 (IMU 400Hz, 里程计 100Hz)
/manifold/ODIN2/device0/imu:
  reliability: reliable
  history: keep_last
  depth: 4000

/manifold/ODIN2/device0/odometry:
  reliability: reliable
  history: keep_last
  depth: 4000

/manifold/ODIN2/device0/odometry_hf:
  reliability: reliable
  history: keep_last
  depth: 4000

# Point clouds (~10Hz)
# 点云数据 (~10Hz)
/manifold/ODIN2/device0/cloud/raw:
  reliability: reliable
  history: keep_last
  depth: 300

/manifold/ODIN2/device0/cloud/slam:
  reliability: reliable
  history: keep_last
  depth: 300

/manifold/ODIN2/device0/cloud/render:
  reliability: reliable
  history: keep_last
  depth: 300

# Camera 0 (~30Hz)
# 相机0 (~30Hz)
/manifold/ODIN2/device0/camera0/compressed:
  reliability: reliable
  history: keep_last
  depth: 300

/manifold/ODIN2/device0/camera0/raw:
  reliability: reliable
  history: keep_last
  depth: 300

/manifold/ODIN2/device0/camera0/rect:
  reliability: reliable
  history: keep_last
  depth: 300

/manifold/ODIN2/device0/camera0/undistort:
  reliability: reliable
  history: keep_last
  depth: 300

/manifold/ODIN2/device0/camera0/camera_info:
  reliability: reliable
  history: keep_last
  depth: 100

# Camera 1 (~30Hz)
# 相机1 (~30Hz)
/manifold/ODIN2/device0/camera1/compressed:
  reliability: reliable
  history: keep_last
  depth: 300

/manifold/ODIN2/device0/camera1/raw:
  reliability: reliable
  history: keep_last
  depth: 300

/manifold/ODIN2/device0/camera1/rect:
  reliability: reliable
  history: keep_last
  depth: 300

/manifold/ODIN2/device0/camera1/undistort:
  reliability: reliable
  history: keep_last
  depth: 300

/manifold/ODIN2/device0/camera1/camera_info:
  reliability: reliable
  history: keep_last
  depth: 300

# Stereo
/manifold/ODIN2/device0/stereo/depth:
  reliability: reliable
  history: keep_last
  depth: 50

/manifold/ODIN2/device0/stereo/disparity:
  reliability: reliable
  history: keep_last
  depth: 50

# TF
/tf:
  reliability: reliable
  history: keep_last
  depth: 500

/tf_static:
  reliability: reliable
  history: keep_last
  depth: 100
