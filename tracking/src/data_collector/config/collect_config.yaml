data_dir: "./data"

max_queue_size: 5
max_age: 0.5
collection_frequency: 30

# PICO A-button record flag (published by pico_bridge). Remove/comment to
# disable remote start/stop; keyboard s/d always works.
record_flag_topic: "/pico/record_flag"

datasets:
  "/observations/images/fisheye_1":
    topic: "/fisheye_1/image/compressed"
    processor: "data_collector.data_processor.CompressedImageProcessor"
    processor_config:
      resize: [640, 480]
      output_shape: [480, 640, 3]
      dtype: "uint8"
      description: "Fisheye camera 1 image"

  "/observations/images/fisheye_2":
    topic: "/fisheye_2/image/compressed"
    processor: "data_collector.data_processor.CompressedImageProcessor"
    processor_config:
      resize: [640, 480]
      output_shape: [480, 640, 3]
      dtype: "uint8"
      description: "Fisheye camera 2 image"

  "/observations/images/cam_left":
    topic: "/pico/cam_left/compressed"
    processor: "data_collector.data_processor.CompressedImageProcessor"
    processor_config:
      resize: [640, 480]
      output_shape: [480, 640, 3]
      dtype: "uint8"
      description: "PICO left camera JPEG"

  "/observations/images/cam_right":
    topic: "/pico/cam_right/compressed"
    processor: "data_collector.data_processor.CompressedImageProcessor"
    processor_config:
      resize: [640, 480]
      output_shape: [480, 640, 3]
      dtype: "uint8"
      description: "PICO right camera JPEG"

  "/states/pose_head":
    topic: "/pico/pose/head"
    processor: "data_collector.data_processor.PoseStampedProcessor"
    processor_config:
      description: "PICO head 6DOF (pos3 + quat4 xyzw)"

  "/states/pose_left_hand":
    topic: "/pico/pose/left_hand"
    processor: "data_collector.data_processor.PoseStampedProcessor"
    processor_config:
      description: "PICO left controller 6DOF"

  "/states/pose_right_hand":
    topic: "/pico/pose/right_hand"
    processor: "data_collector.data_processor.PoseStampedProcessor"
    processor_config:
      description: "PICO right controller 6DOF"

  # Complete PICO BodyTrackerRole frame. Joint order follows the latest APK
  # protocol: 0x20-0x37 = Pelvis ... RIGHT_HAND.
  "/states/smpl":
    topic: "/pico/smpl"
    processor: "data_collector.data_processor.SmplPoseArrayProcessor"
    processor_config:
      description: "PICO full 24-joint body pose [xyz + quaternion xyzw]"

  # Odin odometry. These topics are remapped to the same names by
  # pico_odin/odin_select.launch.py for both Odin1 and Odin Lite. local is
  # published only by Odin1 when map relocalization/local_pose is enabled.
  "/states/odin/odom":
    topic: "/raw/odom/odin"
    processor: "data_collector.data_processor.OdometryProcessor"
    processor_config:
      description: "Odin odometry"

  "/states/odin/odom_highfreq":
    topic: "/raw/odom/odin_highfreq"
    processor: "data_collector.data_processor.OdometryProcessor"
    processor_config:
      description: "Odin high-frequency odometry"

  "/states/odin/odom_local":
    topic: "/raw/odom/odin_local"
    processor: "data_collector.data_processor.OdometryProcessor"
    required: false
    processor_config:
      description: "Odin map-frame local odometry after relocalization"

  "/observations/images/hand_left":
    topic: "/pico/ble/left"
    processor: "data_collector.data_processor.BleFrameProcessor"
    processor_config:
      description: "Left BLE raw payload [4B esp32_ts | sensor_bytes]"

  "/observations/images/hand_right":
    topic: "/pico/ble/right"
    processor: "data_collector.data_processor.BleFrameProcessor"
    processor_config:
      description: "Right BLE raw payload [4B esp32_ts | sensor_bytes]"

topics:
  "/fisheye_1/image/compressed":
    msg_type: "sensor_msgs.msg.CompressedImage"
    description: "Fisheye camera 1 compressed image"

  "/fisheye_2/image/compressed":
    msg_type: "sensor_msgs.msg.CompressedImage"
    description: "Fisheye camera 2 compressed image"

  "/pico/cam_left/compressed":
    msg_type: "sensor_msgs.msg.CompressedImage"
    description: "PICO left camera"
  "/pico/cam_right/compressed":
    msg_type: "sensor_msgs.msg.CompressedImage"
    description: "PICO right camera"
  "/pico/pose/head":
    msg_type: "geometry_msgs.msg.PoseStamped"
    description: "PICO head 6DOF"
  "/pico/pose/left_hand":
    msg_type: "geometry_msgs.msg.PoseStamped"
    description: "PICO left controller 6DOF"
  "/pico/pose/right_hand":
    msg_type: "geometry_msgs.msg.PoseStamped"
    description: "PICO right controller 6DOF"
  "/pico/smpl":
    msg_type: "geometry_msgs.msg.PoseArray"
    description: "PICO complete 24-joint BodyTrackerRole frame"
  "/raw/odom/odin":
    msg_type: "nav_msgs.msg.Odometry"
    description: "Odin odometry"
  "/raw/odom/odin_highfreq":
    msg_type: "nav_msgs.msg.Odometry"
    description: "Odin high-frequency odometry"
  "/raw/odom/odin_local":
    msg_type: "nav_msgs.msg.Odometry"
    description: "Odin map-frame local odometry after relocalization"
  "/pico/ble/left":
    msg_type: "pico_bridge.msg.BleFrame"
    description: "Left BLE frame"
  "/pico/ble/right":
    msg_type: "pico_bridge.msg.BleFrame"
    description: "Right BLE frame"
