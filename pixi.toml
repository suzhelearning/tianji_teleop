[workspace]
name = "tianji-teleop"
version = "0.2.0"
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
python = "3.11.*"
pip = "*"
cmake = ">=3.24,<4"
ninja = ">=1.11"
cxx-compiler = ">=1.9"
libmujoco = "==3.10.0"
glfw = ">=3.4,<4"
eigen = ">=3.4,<4"
libpinocchio = ">=3.8,<4"
libosqp = ">=1.0,<2"
qpoases = ">=3.2,<4"
yaml-cpp = ">=0.8,<1"
gtest = ">=1.15,<2"
matplotlib = ">=3.10,<4"

[tasks]
configure = "cmake -S control -B control/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DPython3_EXECUTABLE=$PWD/.venv/bin/python"
build = "cmake --build control/build --parallel 4"
test-native = "ctest --test-dir control/build --output-on-failure"
build-manus = "bash manus/build.sh"

[feature.tracking]
channels = ["conda-forge", "https://prefix.dev/robostack-staging"]

[feature.tracking.dependencies]
ros-humble-desktop = "*"
ros-humble-rclcpp = "*"
ros-humble-rclpy = "*"
ros-humble-sensor-msgs = "*"
ros-humble-geometry-msgs = "*"
ros-humble-nav-msgs = "*"
ros-humble-visualization-msgs = "*"
ros-humble-std-msgs = "*"
ros-humble-std-srvs = "*"
ros-humble-builtin-interfaces = "*"
ros-humble-rosidl-default-generators = "*"
ros-humble-rosidl-default-runtime = "*"
ros-humble-ament-cmake = "*"
ros-humble-ament-cmake-gtest = "*"
ros-humble-ament-cmake-python = "*"
ros-humble-ament-index-python = "*"
ros-humble-ament-package = "*"
ros-humble-ament-index-cpp = "*"
ros-humble-launch = "*"
ros-humble-launch-ros = "*"
ros-humble-launch-xml = "*"
ros-humble-cv-bridge = "*"
ros-humble-image-transport = "*"
ros-humble-pcl-conversions = "*"
ros-humble-stereo-msgs = "*"
ros-humble-tf2 = "*"
ros-humble-tf2-ros = "*"
ros-humble-tf2-geometry-msgs = "*"
ros-humble-message-filters = "*"
ros-humble-rcpputils = "*"
colcon-common-extensions = "*"
compilers = "*"
pkg-config = "*"
make = "*"
hdf5 = "*"
libopencv = "*"
opencv = "*"
pcl = "*"
openssl = "*"
libusb = "*"
tmux = ">=3.7b,<4"
python = "3.11.*"
pip = "*"
cmake = "<4"
ninja = "*"
eigen = "*"
yaml-cpp = "*"
setuptools = "<80"
numpy = "*"
h5py = "*"
pyyaml = "*"
mujoco = "*"
gtest = "*"
empy = ">=3.3.4,<4"
pytest = ">=8,<9"

[environments]
default = { features = [] }
tracking = { features = ["tracking"], no-default-feature = true }
