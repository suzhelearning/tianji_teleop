[workspace]
name = "tianji-teleop"
version = "0.3.0"
# ROS 2 Jazzy for SPD commands; the native control ABI stays isolated.
channels = ["https://prefix.dev/robostack-jazzy", "conda-forge"]
platforms = [{ name = "linux-x64-glibc234", platform = "linux-64", glibc = "2.34" }]

[feature.control.dependencies]
# Native DLS/Ruckig worker and display-only viewer toolchain.
cmake = ">=3.24,<4"
ninja = ">=1.11"
cxx-compiler = ">=1.9"
compilers = "*"
pkg-config = "*"
make = "*"
eigen = ">=3.4,<4"
libpinocchio = ">=3.8,<4"
# Pinned MuJoCo API and GLFW for the auxiliary viewer.
libmujoco = "==3.10.0"
glfw = ">=3.4,<4"
yaml-cpp = ">=0.8,<1"
gtest = ">=1.15,<2"

# Message generation and DDS transport for the SPD Python publisher.
[feature.ros.dependencies]
python = "3.12.*"
numpy = "*"
colcon-common-extensions = "*"
ros-jazzy-rclcpp = "*"
ros-jazzy-rmw-fastrtps-cpp = "*"
ros-jazzy-ament-cmake = "*"
ros-jazzy-ament-cmake-python = "*"
ros-jazzy-rosidl-default-generators = "*"
ros-jazzy-rosidl-default-runtime = "*"
ros-jazzy-rosidl-typesupport-fastrtps-c = "*"
ros-jazzy-rosidl-typesupport-fastrtps-cpp = "*"
ros-jazzy-rosidl-typesupport-introspection-c = "*"
ros-jazzy-rosidl-typesupport-introspection-cpp = "*"
ros-jazzy-std-msgs = "*"
ros-jazzy-geometry-msgs = "*"
ros-jazzy-builtin-interfaces = "*"

[feature.spd.dependencies]
python = "3.12.*"
pip = "*"
setuptools = ">=68,<80"
wheel = "*"
numpy = "*"
scipy = ">=1.11,<2"
h5py = "*"
pyyaml = ">=6,<7"
pytest = ">=8,<9"
cmake = ">=3.24,<4"
ninja = ">=1.11"
cxx-compiler = ">=1.9"
make = "*"
pkg-config = "*"
empy = ">=3.3.4,<4"
libmujoco = "==3.10.0"
mujoco-python = "==3.10.0"
ros-jazzy-rclpy = "*"
ros-jazzy-ros2run = "*"
ros-jazzy-ros2topic = "*"

[feature.spd.activation.env]
TIANJI_ENVIRONMENT = "spd"

ROS_VERSION = "2"
RMW_IMPLEMENTATION = "rmw_fastrtps_cpp"
ROS_DOMAIN_ID = "120"
ROS_AUTOMATIC_DISCOVERY_RANGE = "LOCALHOST"
ROS_USE_SIM_TIME = "false"
TIANJI_WORKSPACE = "$PIXI_PROJECT_ROOT"
[feature.spd.tasks]
build = "bash bash/build_spd.sh"
test-pico2 = "bash bash/test_python.sh pico2"
spd-quest-teleop = "bash bash/run_quest_hand_sim.sh"
spd-quest-receive = "python tools/hand_tracking/quest_hand_tracking_receiver.py"

[environments]
control = { features = ["control"], no-default-feature = true, solve-group = "control" }
spd = { features = ["ros", "spd"], no-default-feature = true, solve-group = "spd" }
