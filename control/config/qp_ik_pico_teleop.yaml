# PICO SPARK Headroom Feedforward Velocity QP default profile.
controller:
  rate_hz: 200.0
  model_state_only: true
  initial_posture_enabled: true
  home_config: ../mapped_palm/config/home.yaml
control:
  level: velocity
ik:
  algorithm: spark_upper_qpoases_headroom_feedforward_velocity_qp
cartesian_servo:
  kp_position: [15.0, 15.0, 15.0]
  kp_orientation: [10.0, 10.0, 10.0]
  adaptive_gain_enabled: true
  kp_position_near: [4.0, 4.0, 4.0]
  kp_orientation_near: [3.0, 3.0, 3.0]
  position_gain_transition_start_m: 0.02
  position_gain_transition_end_m: 0.22
  orientation_gain_transition_start_rad: 0.03
  orientation_gain_transition_end_rad: 0.15
  kff_linear: 0.0
  kff_angular: 0.0
  feedforward_filter_cutoff_hz: 15.0
  prediction_horizon_seconds: 0.015
  target_timeout_seconds: 0.5
  max_linear_velocity: 3.0
  max_angular_velocity: 12.0
cartesian_otg:
  enabled: true
  # Follow position directly; do not turn noisy PICO linear twist into a
  # velocity-tracking OTG reference. Set false for the legacy behavior.
  translation_position_mode: true
  translation_tracking_enabled: true
  translation_tracking_gain: 30.0
  translation_stationary_velocity_threshold: 1.0e-4
  translation_prediction_enabled: true
  translation_prediction_horizon_seconds: 0.015
  # Suppress low-frequency optical/controller drift after the hand settles.
  # Translation and orientation latch independently and release with hysteresis.
  stationary_hold_enabled: true
  stationary_hold_dwell_seconds: 0.15
  translation_hold_enter_velocity_m_s: 0.06
  translation_hold_exit_velocity_m_s: 0.12
  translation_hold_exit_position_error_m: 0.020
  orientation_hold_enter_velocity_rad_s: 0.12
  orientation_hold_exit_velocity_rad_s: 0.25
  orientation_hold_exit_error_rad: 0.035
  translation_velocity_max: 3.0
  translation_acceleration_max: 30.0
  translation_jerk_max: 1000.0
  angular_velocity_max: 12.0
  angular_acceleration_max: 100.0
  angular_jerk_max: 3000.0
  orientation_gain: 10.0
  orientation_settle_error_rad: 1.0e-5
  angular_settle_velocity_rad_s: 1.0e-4
  angular_settle_acceleration_rad_s2: 1.0e-3
cartesian_otg_control_profiles:
  enabled: true
  # Velocity QP gets the smoother limits proven by the standalone velocity
  # profile. Acceleration QP retains its higher-bandwidth OTG limits.
  velocity:
    translation_velocity_max: 3.0
    translation_acceleration_max: 12.0
    translation_jerk_max: 120.0
    angular_velocity_max: 12.0
    angular_acceleration_max: 40.0
    angular_jerk_max: 400.0
  acceleration:
    translation_velocity_max: 3.0
    translation_acceleration_max: 30.0
    translation_jerk_max: 1000.0
    angular_velocity_max: 12.0
    angular_acceleration_max: 100.0
    angular_jerk_max: 3000.0
cartesian_acceleration:
  kp_position: 100.0
  kd_position: 20.0
  kp_orientation: 70.0
  kd_orientation: 16.0
  linear_limit: 30.0
  angular_limit: 100.0
acceleration_qp:
  slack_weight_position: 2.0e5
  slack_weight_orientation: 3.0e5
  slack_linear_scale: 5.0
  slack_angular_scale: 15.0
  regularization: 5.0e-4
  jerk_weight: 2.0e-3
  posture_weight: 2.0e-2
  posture_kp: 12.0
  posture_kd: 7.0
  arm_angle_weight: 10.0
  task_scaling_enabled: true
  task_scaling_min_position: 0.75
  task_scaling_min_orientation: 0.75
  task_scaling_weight_position: 8000.0
  task_scaling_weight_orientation: 3000.0
  equality_tolerance: 1.0e-8
iterative_dls:
  # Velocity-QP redundancy guide: solve the nearest pose-level DLS branch,
  # smooth it with the joint OTG, then inject only its strict Cartesian
  # null-space velocity. The guide is seeded from q_model every cycle, so it
  # selects the nearest continuous IK branch without changing the Cartesian
  # velocity-QP primary task.
  posture_reference_enabled: false
  max_iterations: 20
  position_tolerance_m: 5.0e-4
  orientation_tolerance_rad: 1.0e-2
  position_gain: 1.0
  orientation_gain: 1.0
  minimum_damping: 1.0e-6
  maximum_damping: 0.3
  singular_value_threshold: 0.05
  maximum_step_norm_rad: 0.35
  maximum_joint_step_rad: 0.20
  minimum_merit_improvement: 1.0e-10
  nominal_posture_gain: 0.05
  arm_angle_gain: 0.025
  maximum_goal_step_rad: 0.02
  # This is a guide-only inner envelope; final QP hard limits are unchanged.
  posture_reference_margin_rad: 0.05
spark_upper_qpoases:
  # Uses tracking/'s TJVR v4 corrected shoulder/elbow/wrist/palm data.
  calibration_frames: 30
  minimum_scale: 0.5
  maximum_scale: 2.0
  stage1_max_iterations: 10
  stage2_max_iterations: 10
  convergence_delta: 1.0e-4
  integration_step: 1.0
  target_blend_seconds: 0.15
  maximum_joint_rotation_jump_rad: 0.75
  ik_cycle_budget_seconds: 0.0045
  trust_region_rad: 0.20
  damping: 0.5
  joint_limit_margin_rad: 0.05
  stage1_upper_direction_weight: 5.0
  stage1_forearm_direction_weight: 5.0
  stage1_palm_orientation_weight: 5.0
  stage2_upper_direction_weight: 5.0
  stage2_forearm_direction_weight: 5.0
  stage2_palm_orientation_weight: 5.0
  stage2_elbow_position_weight: 5.0
  stage2_wrist_position_weight: 5.0
  stage2_palm_position_weight: 10.0
  # Historical weak guide used by the Ruckig-guided A/B route.
  posture_weight: 2.0e-2
  # The two-stage position IK is the primary velocity reference in
  # spark_upper_qpoases_velocity_qp. Its Cartesian target is derived from the
  # same qdot reference, so this weight preserves the SPARK arm shape without
  # creating an independent task conflict.
  joint_reference_weight: 3.0e4
  # Smoothly introduce and remove the strong joint-reference objective at
  # stream start/resynchronization and stale transitions.
  joint_reference_attack_seconds: 0.8
  joint_reference_release_seconds: 0.4
  # Softly preserve the previous acceleration trend. The existing hard jerk
  # bound remains unchanged and is still the final safety envelope.
  joint_reference_smoothness_weight: 3.0e3
  posture_position_gain: 4.0
  otg_position_tolerance_m: 0.002
  otg_orientation_tolerance_rad: 0.02
  otg_continuity_weight: 1.0
  # Isolated to spark_guided_velocity_qp; existing algorithm behavior is kept.
  enforce_hard_jerk_bounds: true
spark_feedforward_velocity_qp:
  enabled: true
  alpha: 0.70
  beta: 0.16
  dt_median_window: 31
  dt_min_ratio: 0.5
  dt_max_ratio: 1.5
  maximum_joint_jump_rad: 0.35
  stale_velocity_decay_seconds: 0.02
  # Release stale source velocity quickly when SPARK stops or reverses, then
  # brake the shaped reference before it crosses the current target.
  source_stationary_velocity_rad_s: 0.002
  velocity_reversal_decay: 0.7225
  velocity_stationary_decay: 0.9025
  target_braking_acceleration_scale: 0.75
  palm_twist_filter_alpha: 1.0
  palm_twist_lowpass_cutoff_hz: 0.8
  reference_velocity_scale: 1.0
  reference_acceleration_scale: 1.0
  reference_jerk_scale: 1.0
  # Makes the jerk-limited joint reference converge to static q_ik targets;
  # the alpha-beta velocity alone is zero for a stationary source.
  reference_position_gain: 10.0
  # Raw SPARK-palm twist is already phase aligned with the Cartesian target.
  # Modest feedforward removes source lag without the low-frequency gain
  # inflation produced by the former full J(q_ff) qdot_ff injection.
  position_feedforward_gain: 0.28
  orientation_feedforward_gain: 0.30
  position_high_frequency_feedforward_gain: 0.28
  orientation_high_frequency_feedforward_gain: 0.70
  joint_position_gain: 4.0
  attack_seconds: 0.04
  release_seconds: 0.05
spark_headroom_feedforward_velocity_qp:
  enabled: true
  # Source-specific QP output continuity. These weights affect only the
  # headroom-feedforward algorithm; historical feedforward modes keep their
  # original posture objective.
  joint_reference_smoothness_weight: 1.0e5
  joint_reference_jerk_smoothness_weight: 3.0e4
  low_headroom: 0.10
  full_headroom: 0.30
  reduction_time_seconds: 0.020
  recovery_time_seconds: 0.100
  # Treat jerk as a persistence envelope rather than an instantaneous switch.
  # One 5 ms limited sample no longer removes feedforward, while sustained
  # saturation still closes it quickly and recovers conservatively.
  jerk_usage_attack_seconds: 0.050
  jerk_usage_release_seconds: 0.150
  task_scaling_min_position: 0.75
  task_scaling_min_orientation: 0.75
  # Hold the last accepted two-stage-IK posture while the raw SPARK palm is
  # effectively stationary. This rejects elbow/wrist skeleton jitter without
  # filtering or delaying genuine Cartesian palm motion.
  stationary_reference_hold_linear_velocity_m_s: 0.02
  stationary_reference_hold_angular_velocity_rad_s: 0.10
  # If the operator has settled while constraints leave no useful Cartesian
  # headroom, brake against the current model pose instead of chasing an
  # infeasible final target. A stale PICO stream enters this hold immediately.
  settled_hold_enabled: true
  settled_hold_dwell_seconds: 0.30
  settled_hold_headroom_enter: 0.05
dls_posture_ruckig:
  # Historical A/B path.  The active velocity-QP route derives its weak
  # posture velocity directly from q_goal - q_model so the guide cannot drift
  # away from the state actually integrated by the QP.
  enabled: false
  velocity_scale: 0.6
  max_velocity_rad_s: [0.8, 0.8, 1.0, 1.0, 1.2, 1.2, 1.2]
  max_acceleration_rad_s2: [7.854, 7.854, 15.708, 15.708, 15.708, 15.708, 15.708]
  max_jerk_rad_s3: [600.0, 600.0, 1000.0, 1000.0, 1000.0, 1000.0, 1000.0]
  validation_tolerance: 1.0e-8
joint_acceleration_limits:
  margin_rad: 0.05
  velocity_scale: 1.0
  # DLS/Ruckig-tested per-joint dynamic envelope.
  max_acceleration_rad_s2: [60.0, 60.0, 60.0, 90.0, 90.0, 90.0, 90.0]
  braking_acceleration_rad_s2: [45.0, 45.0, 45.0, 67.5, 67.5, 67.5, 67.5]
  hard_jerk_enabled: true
  max_jerk_rad_s3: [1000.0, 1000.0, 1000.0, 1500.0, 1500.0, 1500.0, 1500.0]
qp:
  solver: qpoases
  position_weight: 1.0
  orientation_weight: 0.5
  regularization: 1.0e-5
  nominal_weight: 1.0e-3
  nominal_gain: 0.2
hierarchical_qp:
  lambda_reg: 1.0e-4
  posture_weight: 2.0e-2
  # Keep J5-J7 away from their hard stops without slowing shoulder/elbow
  # redundancy motion.
  wrist_posture_weight_scale: 100.0
  continuity_weight: 1.0e-3
  # Soft joint-jerk predictor. It smooths acceleration reversals without
  # shrinking the velocity-QP hard feasible set used by the outward barrier.
  jerk_weight: 2.0e-2
  nominal_gain: 2.0
  # Task scaling preserves Cartesian direction and releases only magnitude when
  # the arm-angle objective and hard dynamic bounds cannot all be met at full
  # speed.  This is still a velocity-level QP; qdot remains the motion variable.
  arm_angle_weight: 3.0
  task_scaling_enabled: true
  # Keep enough scaling range for the QP to preserve Cartesian direction when
  # the arm-angle envelope or a hard dynamic bound becomes active.
  task_scaling_min_position: 0.75
  task_scaling_min_orientation: 0.75
  task_scaling_weight_position: 8000.0
  task_scaling_weight_orientation: 3000.0
  slack_weight_position: 3.0e4
  slack_weight_orientation: 3.0e4
  slack_position_scale: 1.0
  slack_orientation_scale: 2.0
  equality_tolerance: 1.0e-8
dls:
  damping: 1.0e-3
  nominal_gain: 0.2
joint_limits:
  margin_rad: 0.05
  velocity_scale: 1.0
  max_acceleration_rad_s2: [60.0, 60.0, 60.0, 90.0, 90.0, 90.0, 90.0]
  braking_acceleration_rad_s2: [45.0, 45.0, 45.0, 67.5, 67.5, 67.5, 67.5]
  hard_jerk_enabled: false
  max_jerk_rad_s3: [1000.0, 1000.0, 1000.0, 1500.0, 1500.0, 1500.0, 1500.0]
osqp:
  max_iterations: 3000
  absolute_tolerance: 1.0e-9
  relative_tolerance: 1.0e-9
  polishing: false
qpoases:
  # Normal-path budget is one millisecond per arm in the 5 ms control period.
  # A cold retry is exceptional; persistent failure uses a bounded fallback.
  max_working_set_recalculations: 100
  cpu_time_limit_seconds: 0.001
safety:
  bound_tolerance: 1.0e-8
  hessian_eigenvalue_tolerance: 1.0e-10
  max_target_position_step: 0.05
  max_target_orientation_step: 0.20
  reference_tracking_warn_rad: 0.10
  reference_tracking_stop_rad: 0.20
  velocity_reference_tracking_warn_rad_s: 0.50
  velocity_reference_tracking_stop_rad_s: 1.00
arm_angle:
  enabled: true
  # With a hard one-sided J3 envelope the exact 6D Cartesian null-space can
  # force J5-J7 to counter-rotate at their limits. Let the soft orientation
  # task yield before the position and elbow-plane objectives instead.
  nullspace_only: false
  kp_velocity: 32.0
  max_velocity_rad_s: 24.0
  kp_acceleration: 80.0
  kd_acceleration: 18.0
  max_acceleration_rad_s2: 60.0
  minimum_radius_m: 0.015
  full_weight_radius_m: 0.050
  # Keep enough elbow-plane radius for the arm-angle state to remain
  # observable; unlike minimum_radius_m this is a branch barrier, not a task
  # deactivation threshold.
  branch_lock_radius_m: 0.040
  # The elbow-plane reference is secondary to Cartesian tracking. Limiting it
  # to 2 rad/s rejects 90 Hz skeleton direction spikes without delaying the
  # end-effector pose path.
  reference_rate_limit_rad_s: 2.0
  reference_projection_hold_enter: 0.05
  reference_projection_hold_exit: 0.10
  # Schmitt band around +/-pi prevents the scalar arm-angle controller from
  # reversing direction every sample at the S1 antipode.
  error_branch_hysteresis_rad: 0.20
  # Retained for A/B compatibility. Sliding this reference degraded Cartesian
  # tracking in replay, so the PICO profile preserves the true reference.
  reference_governor_enabled: false
  reference_governor_enter_error_rad: 1.50
  reference_governor_exit_error_rad: 1.30
  reference_governor_tracking_error_rad: 1.20
  # At an observable elbow radius, prevent the modeled arm plane from running
  # more than 1.5 rad away from the true PICO plane. The row is feasibility
  # clipped against the per-cycle velocity/acceleration/jerk bounds.
  tracking_envelope_enabled: false
  tracking_envelope_max_error_rad: 1.50
  tracking_envelope_gain: 8.0
  continuity_kp_velocity: 8.0
  # Must exceed the 2 rad/s PICO arm-direction reference slew rate; otherwise
  # arm-angle error is guaranteed to accumulate during fast teleoperation.
  continuity_max_velocity_rad_s: 2.5
  continuity_kp_acceleration: 8.0
  continuity_kd_acceleration: 4.0
  continuity_max_acceleration_rad_s2: 8.0
  continuity_weight_scale: 30.0
  # Fade only the redundancy correction as a joint enters this inner buffer.
  # Cartesian QP motion and all hard joint limits remain unchanged.
  joint_limit_soft_margin_rad: 0.30
  # Once a joint enters that buffer, blend the arm-angle redundancy motion
  # toward the center of the safe range instead of merely freezing at the
  # boundary. This prevents the 7-DoF branch from becoming trapped at limits.
  joint_limit_recovery_gain_rad_s_per_rad: 2.0
  branch_lock_enabled: true
  branch_lock_kp_velocity: 8.0
  branch_lock_kp_acceleration: 100.0
  branch_lock_kd_acceleration: 20.0

upper_arm_outward:
  minimum_outward_distance_m: 0.0
  velocity_gain: 8.0
  acceleration_kp: 100.0
  acceleration_kd: 20.0

trajectories:
  circle_radius: 0.06
  figure_eight_width: 0.08
  figure_eight_height: 0.05
  angular_amplitude: 0.35
  frequency_hz: 1.0
pico_teleop:
  max_position_jump_m: 0.15
  max_orientation_jump_rad: 0.60
