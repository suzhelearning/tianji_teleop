# MANUS landmarks with official Hand2 beta1 assets.
# The bridge derives the wrist-axis rotation from the Hand2 neutral model.
optimizer:
  type: "AdaptiveOptimizerAnalytical"
  urdf_path: "../../wuji_retargeting/wuji-description/hand2/hand2_beta1/body/urdf/left.urdf"
  mjcf_path: "../../wuji_retargeting/wuji-description/hand2/hand2_beta1/body/mjcf/left.xml"
  link_naming:
    prefix: "l_"
    palm: "wrist"
    fingers: [thumb, index_finger, middle_finger, ring_finger, pinky]
    pip: "{finger}_middle"
    dip: "{finger}_distal"
    tip: "{finger}_tip"
    link1: "{finger}_proximal_abd"

retarget:
  huber_delta: 2.0
  huber_delta_dir: 0.5
  norm_delta: 0.04
  w_pos: 1.0
  w_dir: 2.0
  scaling: 1.0
  project_tip_dir: false
  w_full_hand: 1.0
  segment_scaling:
    thumb: [1, 1, 1]
    index: [1, 1, 1]
    middle: [1, 1, 1]
    ring: [1, 1, 1]
    pinky: [1, 1, 1]
  pinch_thresholds:
    index: {d1: 2.0, d2: 4.0}
    middle: {d1: 2.0, d2: 4.0}
    ring: {d1: 2.0, d2: 4.0}
    pinky: {d1: 2.0, d2: 4.0}
  lp_alpha: 0.2
