register_keys:
  # Odom-only profile for PICO pelvis calibration and runtime correction.
  # These consumers need the low- and high-frequency odometry carried by the
  # Odin odometry channel; point clouds, cameras, and IMU only add bandwidth.
  enable_raw_point: 0
  enable_slam_point: 0
  enable_image0: 0
  enable_image1: 0
  enable_imu: 0
  enable_odom: 1

  post_process: 0
  send_image_raw: 0
  send_image2_raw: 0
  send_cloud_render: 0
  send_ess_output: 0
  send_depth_pointcloud: 0
  enable_reprojection: 0
  reprojection_mode: "raw"
